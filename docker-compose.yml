# Development infrastructure for Open Telemed.
# - `docker compose up postgres redis mailpit` -> local infrastructure, app on the host
# - `docker compose --profile app up --build`  -> optional containerized app
#
# Generate a real APP_KEY once: `pnpm ace generate:key` (then export APP_KEY=...).
name: open-telemed

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_telemed
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d open_telemed']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', 'redis']
    ports:
      - '6381:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.30.4
    restart: unless-stopped
    ports:
      - '1026:1025'
      - '8026:8025'

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: ['--dev', '--bind', '0.0.0.0', '--node-ip', '${LIVEKIT_NODE_IP:-127.0.0.1}']
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

  app:
    profiles: ['app']
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - uploads:/app/storage
    ports:
      - '3333:3333'
    environment:
      TZ: UTC
      NODE_ENV: production
      PORT: 3333
      HOST: 0.0.0.0
      LOG_LEVEL: info
      APP_NAME: ${APP_NAME:-Open Telemed}
      APP_URL: ${APP_URL:-http://localhost:3333}
      APP_SOURCE_URL: ${APP_SOURCE_URL:-}
      # Development placeholders only. Override every secret outside disposable environments.
      APP_KEY: ${APP_KEY:-dev_app_key_change_me_32_chars_min}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev_access_token_secret_change_me}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_token_secret_change_me}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:-dev_email_verification_secret_change_me}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:-dev_password_reset_secret_change_me}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
      JWT_ISSUER: ${JWT_ISSUER:-open-telemed}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-open-telemed}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-token}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-open-telemed-session}
      REGISTRATION_WORKSPACE_MODE: ${REGISTRATION_WORKSPACE_MODE:-none}
      DEMO_PAGES_ENABLED: 'false'
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      PLATFORM_HOSTS: ${PLATFORM_HOSTS:-localhost,127.0.0.1}
      TRUST_PROXY: 'false'
      SESSION_DRIVER: cookie
      LIMITER_STORE: redis
      DRIVE_DISK: fs
      DB_CONNECTION: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: open_telemed
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis
      REDIS_DB: 0
      QUEUE_REDIS_HOST: redis
      QUEUE_REDIS_PORT: 6379
      QUEUE_REDIS_PASSWORD: redis
      MAIL_MAILER: smtp
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Open Telemed}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025

volumes:
  pgdata:
  redisdata:
  uploads:
