<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">open-telemed</title>
  <desc id="d">1:1 multi-clinic, white-label teleconsultation on AdonisJS 7, React 19 and LiveKit</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04131a"/>
      <stop offset="0.55" stop-color="#062a2c"/>
      <stop offset="1" stop-color="#0b3b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- left: identity -->
  <g transform="translate(64 58)" fill="none" stroke="#5eead4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 33.5 6.8 21.6A8.6 8.6 0 0 1 19 9.4a8.6 8.6 0 0 1 12.2 12.2Z"/>
    <path d="M4 20h7l3-5 4 9 3-4h13" stroke="#ccfbf1"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="112" y="84" fill="#7dd3c8" font-size="17">$ teleconsult --1:1</text>
    <text x="64" y="150" fill="#f8fafc" font-size="54" font-weight="700" letter-spacing="-1">open<tspan fill="#5eead4">-</tspan>telemed</text>
  </g>
  <rect x="64" y="170" width="300" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="212" fill="#e2e8f0" font-size="21">Multi-clinic, white-label teleconsultation, built for Brazil</text>
    <text x="64" y="242" fill="#94a3b8" font-size="16">AdonisJS 7 · React 19 · Inertia 3 · LiveKit · PostgreSQL · Redis</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="64" y="262" width="104" height="26" rx="13" fill="#14b8a6" fill-opacity="0.16" stroke="#14b8a6" stroke-opacity="0.6"/>
    <text x="116" y="279" fill="#99f6e4" text-anchor="middle">CFM 2.314</text>
    <rect x="176" y="262" width="66" height="26" rx="13" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="209" y="279" fill="#ddd6fe" text-anchor="middle">LGPD</text>
    <rect x="250" y="262" width="112" height="26" rx="13" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="306" y="279" fill="#bae6fd" text-anchor="middle">white label</text>
    <rect x="370" y="262" width="74" height="26" rx="13" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="407" y="279" fill="#fde68a" text-anchor="middle">WebRTC</text>
  </g>

  <!-- right: the patient journey -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <g transform="translate(700 46)">
      <rect width="440" height="50" rx="12" fill="#06201f" stroke="#5eead4" stroke-opacity="0.55"/>
      <circle cx="26" cy="25" r="6" fill="#5eead4"/>
      <text x="44" y="30" fill="#e2e8f0">link /c#secret</text>
      <text x="420" y="30" fill="#5f8f8a" text-anchor="end">no account</text>
    </g>
    <path d="M920 96v14" stroke="#2f5f5b" stroke-width="2" stroke-dasharray="3 3"/>
    <g transform="translate(700 110)">
      <rect width="440" height="50" rx="12" fill="#06201f" stroke="#a78bfa" stroke-opacity="0.65"/>
      <circle cx="26" cy="25" r="6" fill="#a78bfa"/>
      <text x="44" y="30" fill="#e2e8f0">informed consent</text>
      <text x="420" y="30" fill="#5f8f8a" text-anchor="end">version + hash</text>
    </g>
    <path d="M920 160v14" stroke="#2f5f5b" stroke-width="2" stroke-dasharray="3 3"/>
    <g transform="translate(700 174)">
      <rect width="440" height="50" rx="12" fill="#06201f" stroke="#fbbf24" stroke-opacity="0.55"/>
      <circle cx="26" cy="25" r="6" fill="#fbbf24"/>
      <text x="44" y="30" fill="#e2e8f0">waiting room</text>
      <text x="420" y="30" fill="#5f8f8a" text-anchor="end">doctor admits</text>
    </g>
    <path d="M920 224v14" stroke="#2f5f5b" stroke-width="2" stroke-dasharray="3 3"/>
    <g transform="translate(700 238)">
      <rect width="215" height="50" rx="12" fill="#06201f" stroke="#14b8a6" stroke-opacity="0.65"/>
      <circle cx="26" cy="25" r="6" fill="#14b8a6"/>
      <text x="44" y="30" fill="#e2e8f0">1:1 video</text>
      <rect x="225" width="215" height="50" rx="12" fill="#06201f" stroke="#38bdf8" stroke-opacity="0.55"/>
      <circle cx="251" cy="25" r="6" fill="#38bdf8"/>
      <text x="269" y="30" fill="#e2e8f0">outcome</text>
    </g>
  </g>
</svg>
