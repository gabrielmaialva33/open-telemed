      operationId: createConsultation
      security:
        - ServiceToken: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: false
          schema:
            type: integer
            minimum: 1
          description: Active clinic; requires service user membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationCreate'
      responses:
        '200':
          description: Idempotent retry without issuing a secret.
          content:
            application/json:
              schema:
                type: object
                required:
                  - consultation
                  - patient_url
                  - doctor_url
                  - created
                properties:
                  consultation:
                    $ref: '#/components/schemas/ConsultationRecord'
                  patient_url:
                    type: string
                    format: uri
                    nullable: true
                    description: For a configured headless clinic, uses the provisioned clinic
                      patient URL and a secret fragment. The clinic owns
                      recipients, delivery and message template. Null on an
                      idempotent creation retry.
                  doctor_url:
                    type: string
                    format: uri
                    nullable: true
                    description: Null for a configured headless clinic; the clinic renders its own
                      doctor route without a second platform login.
                  created:
                    type: boolean
        '201':
          description: Consultation created. The link secret appears only in the fragment;
            store it securely and send it directly to the patient.
          content:
            application/json:
              schema:
                type: object
                required:
                  - consultation
                  - patient_url
                  - doctor_url
                  - created
                properties:
                  consultation:
                    $ref: '#/components/schemas/ConsultationRecord'
                  patient_url:
                    type: string
                    format: uri
                    nullable: true
                    description: For a configured headless clinic, uses the provisioned clinic
                      patient URL and a secret fragment. The clinic owns
                      recipients, delivery and message template. Null on an
                      idempotent creation retry.
                  doctor_url:
                    type: string
                    format: uri
                    nullable: true
                    description: Null for a configured headless clinic; the clinic renders its own
                      doctor route without a second platform login.
                  created:
                    type: boolean
        '401':
          description: Missing, invalid or expired token.
