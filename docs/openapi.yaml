openapi: 3.0.3
info:
  title: Open Telemed API
  version: 0.1.0
  description: >-
    Open Telemed API. Use a dedicated service user belonging to exactly one clinic, with an
    opaque ServiceToken and explicit abilities. Login JWTs are not accepted by integration
    routes. X-Tenant-Id requires membership; foreign resources return 404. Abilities:
    consultations.create/read/update/link/cancel/audit and professionals.read. Attendance
    remains exclusive to the assigned doctor in the authenticated panel.

    POST with an external_id already used in the clinic returns 200, created=false, the current
    consultation and patient_url=null; payload differences are ignored and no link or event is
    emitted. The first request returns 201, created=true and a secret link. Without external_id
    each POST creates a consultation. A lost first response requires explicit link reissuance.
    PATCH changes scheduled_at/professional_id only while scheduled, without renewing the link;
    reissue expired links. ISO 8601 timestamps require an offset or Z. Reissuance invalidates
    previous links and patient sessions, but does not revoke previously issued LiveKit tokens.

    Exportable medical record/RAC data, not FHIR. Minimum retention is 20 years. Webhook POSTs
    require an origin in WEBHOOK_ALLOWED_ORIGINS and HTTPS in production. ConsultationEvent
    excludes patient names and documents. X-OpenTelemed-Timestamp is Unix seconds at each attempt;
    X-OpenTelemed-Signature is sha256=HMAC-SHA256(secret, timestamp + '.' + exact UTF-8 body).
    Receivers validate timestamp within 300 seconds, HMAC with timingSafeEqual, clinic mapping,
    and unique event_id persisted atomically with effects. Timestamp alone cannot prevent replay
    within the window. Retries reuse event_id/body and recalculate timestamp/signature. Delivery
    can be duplicated or out of order; reconcile current state using GET. Return 2xx after durable
    persistence. Six attempts, exponential backoff starting at 1 second, 10-second timeout,
    no redirects. Exhausted retries require operator intervention. Drain the outbox before
    rotating secrets; each delivery retains its encrypted secret.
  contact:
    name: API Support
    email: support@example.com
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://127.0.0.1:3333
    description: Local development server
  - url: https://api.yourdomain.com
    description: Production server
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access JWT. Opaque refresh tokens are never accepted here.
    ServiceToken:
      type: http
      scheme: bearer
      bearerFormat: Opaque AdonisJS API token
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        username:
          type: string
          example: johndoe
          nullable: true
        email_verified:
          type: boolean
          example: true
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
        updated_at:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00.000Z
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: User
        description:
          type: string
          example: Regular user role
        slug:
          type: string
          enum:
            - root
            - admin
            - user
            - guest
            - editor
          example: user
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthResponse:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        auth:
          $ref: '#/components/schemas/AuthTokens'
        email_verification_sent:
          type: boolean
          description:
            Present on sign-up responses; false means the account was created but email delivery
            failed.
    AuthTokens:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
          description: Short-lived JWT accepted by bearer-authenticated endpoints.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: Opaque one-time refresh credential rotated after every successful refresh.
          example: D4m6j6pTW1u3Jf_Z0Q4K7rJch7Jv8k9xQ4Q6xk2MsGv...
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 32
          description: Opaque refresh token returned by sign-in, sign-up, tenant switch, or refresh.
    PasswordResetRequest:
      type: object
      required:
        - token
        - password
        - password_confirmation
      properties:
        token:
          type: string
          minLength: 32
          description: Opaque single-use password reset token delivered by email.
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
          minLength: 8
    Tenant:
      type: object
      required:
        - id
        - name
        - slug
        - role
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean
        role:
          type: string
          enum:
            - owner
            - admin
            - member
    FileListItem:
      type: object
      required:
        - id
        - client_name
        - file_name
        - file_size
        - file_type
        - file_category
        - url
        - owner
      properties:
        id:
          type: integer
        client_name:
          type: string
        file_name:
          type: string
        file_size:
          type: integer
        file_type:
          type: string
        file_category:
          type: string
          enum:
            - image
            - document
            - video
            - audio
            - file
        url:
          type: string
        owner:
          type: object
          required:
            - id
            - full_name
          properties:
            id:
              type: integer
            full_name:
              type: string
        created_at:
          type: string
          format: date-time
          nullable: true
    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                example: Validation error
              field:
                type: string
                example: email
              rule:
                type: string
                example: email
    Pagination:
      type: object
      properties:
        meta:
          type: object
          properties:
            total:
              type: integer
              example: 100
            per_page:
              type: integer
              example: 10
            current_page:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 10
            first_page:
              type: integer
              example: 1
            first_page_url:
              type: string
              example: /?page=1
            last_page_url:
              type: string
              example: /?page=10
            next_page_url:
              type: string
              example: /?page=2
            previous_page_url:
              type: string
              example: null
    FileUploadResponse:
      type: object
      properties:
        url:
          type: string
          example: https://storage.example.com/files/abc123.pdf
        clientName:
          type: string
          example: document.pdf
        fileCategory:
          type: string
          enum:
            - image
            - document
            - video
            - audio
            - file
          example: document
        fileType:
          type: string
          example: application/pdf
        size:
          type: integer
          example: 12345
        extname:
          type: string
          example: pdf
    ConsultationCreate:
      type: object
      required:
        - professional_id
        - patient_name
        - patient_location
        - scheduled_at
      properties:
        professional_id:
          type: integer
          minimum: 1
        patient_name:
          type: string
          minLength: 2
          maxLength: 160
        patient_document:
          type: string
          maxLength: 32
          description: Optional; never include in logs.
        patient_location:
          type: string
          minLength: 2
          maxLength: 200
          description: Reported patient location during attendance (city/state).
        external_id:
          type: string
          maxLength: 128
          description: Unique per clinic when provided.
        scheduled_at:
          type: string
          format: date-time
    ConsultationRecord:
      type: object
      required:
        - id
        - tenant_id
        - professional_id
        - patient_name
        - patient_location
        - status
        - modality
        - scheduled_at
        - professional
        - consent
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        professional_id:
          type: integer
        external_id:
          type: string
          nullable: true
        patient_name:
          type: string
        patient_document:
          type: string
          nullable: true
        patient_location:
          type: string
        modality:
          type: string
          enum:
            - teleconsulta
        status:
          type: string
          enum:
            - scheduled
            - waiting
            - in_progress
            - ended
            - cancelled
        outcome:
          type: string
          enum:
            - completed
            - referred_in_person
            - patient_declined
            - no_show
            - null
          nullable: true
        recording_allowed:
          type: boolean
          description: Preference only; video is not recorded.
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        admitted_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        retain_until:
          type: string
          format: date-time
          nullable: true
        professional:
          type: object
          required:
            - id
            - name
            - crm
            - crm_uf
          properties:
            id:
              type: integer
            name:
              type: string
            crm:
              type: string
            crm_uf:
              type: string
            rqe:
              type: string
              nullable: true
        consent:
          type: object
          properties:
            version:
              type: integer
            text_hash:
              type: string
            accepted_at:
              type: string
              format: date-time
              nullable: true
          nullable: true
    ConsultationEvent:
      type: object
      required:
        - event_id
        - id
        - event
        - occurred_at
        - tenant_id
        - consultation
      properties:
        event_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
          description: Legacy alias of event_id
        event:
          type: string
          enum:
            - consultation.status_changed
            - consultation.updated
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: integer
        consultation:
          type: object
          required:
            - id
            - external_id
            - status
            - outcome
            - modality
            - professional
            - scheduled_at
            - admitted_at
            - started_at
            - ended_at
          properties:
            id:
              type: integer
            external_id:
              type: string
              nullable: true
            status:
              type: string
              enum:
                - scheduled
                - waiting
                - in_progress
                - ended
                - cancelled
            outcome:
              type: string
              enum:
                - completed
                - referred_in_person
                - patient_declined
                - no_show
                - null
              nullable: true
            modality:
              type: string
              enum:
                - teleconsulta
            scheduled_at:
              type: string
              format: date-time
              nullable: true
            admitted_at:
              type: string
              format: date-time
              nullable: true
            started_at:
              type: string
              format: date-time
              nullable: true
            ended_at:
              type: string
              format: date-time
              nullable: true
            professional:
              type: object
              required:
                - id
                - crm
                - crm_uf
              properties:
                id:
                  type: integer
                crm:
                  type: string
                crm_uf:
                  type: string
  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination
    perPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Number of items per page
    sortByParam:
      name: sort_by
      in: query
      schema:
        type: string
        default: id
      description: Field to sort by
    orderParam:
      name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
      description: Sort order
    searchParam:
      name: search
      in: query
      schema:
        type: string
      description: Search term for filtering results
    tenantHeader:
      name: x-tenant-id
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
      description: Optional active workspace override. Membership and active status are always validated.
  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: Unauthorized
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: Forbidden
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errors:
              - message: Resource not found
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
tags:
  - name: Health
    description: System health monitoring endpoints
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management operations
  - name: Tenants
    description: Tenant membership and active workspace operations
  - name: Roles
    description: Role management operations (admin only)
  - name: Files
    description: File upload and management
  - name: Profile
    description: Current user profile operations
  - name: Permissions
    description: Permission management operations (admin only)
  - name: Consultas
    description: Tenant-scoped integration API
paths:
  /version:
    get:
      operationId: getApiInfo
      summary: Get API information
      description: Returns basic information about the API
      tags:
        - Health
      security: []
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: open-telemed
                  description:
                    type: string
                    example: Full-stack AdonisJS 7 and React starter kit
                  version:
                    type: string
                    example: 0.9.0
                  author:
                    type: string
                    example: Gabriel Maia
                  contributors:
                    type: array
                    items:
                      type: string
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/health:
    get:
      operationId: healthCheck
      summary: Health check
      description: Check the health status of the API and its services
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                    example: true
                  services:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          healthy:
                            type: boolean
                            example: true
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                    example: false
                  services:
                    type: object
  /api/v1/sessions/sign-in:
    post:
      operationId: signIn
      summary: User login
      description: Authenticate a user and receive a short-lived access JWT plus an opaque rotating
        refresh token.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uid
                - password
              properties:
                uid:
                  type: string
                  description: Email or username
                  example: john@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                errors:
                  - message: Invalid credentials
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/sessions/forgot-password:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset link
      description:
        Returns the same accepted response whether or not the email exists. Any issued token is
        opaque, single-use, and stored only as an HMAC.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Request accepted without revealing account existence
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many password reset requests
  /api/v1/sessions/reset-password:
    post:
      operationId: resetPassword
      summary: Reset an account password
      description:
        Consumes a valid reset token, changes the password, invalidates other reset links, and
        revokes active API refresh tokens.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Invalid or expired token
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many password reset attempts
  /api/v1/sessions/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token
      description: Atomically revokes the submitted opaque refresh token and returns a new access/refresh pair.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token pair rotated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/sessions/logout:
    post:
      operationId: revokeSession
      summary: Revoke an API refresh token
      description: Revokes the submitted refresh token. Repeating the request is idempotent.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Refresh token revoked
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me:
    get:
      operationId: getProfile
      summary: Get current user profile
      description: Retrieve the profile of the currently authenticated user
      tags:
        - Profile
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      operationId: deleteOwnAccount
      summary: Delete the authenticated account
      description: Requires the current password and the literal confirmation DELETE. The user is
        anonymized and active API credentials are revoked while historical references remain intact.
      tags:
        - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - confirmation
              properties:
                current_password:
                  type: string
                  format: password
                confirmation:
                  type: string
                  enum:
                    - DELETE
      responses:
        '204':
          description: Account anonymized and credentials revoked
        '400':
          description: Incorrect password or confirmation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me/permissions:
    get:
      operationId: getMyPermissions
      summary: Get current user permissions
      description: Retrieve the permissions of the currently authenticated user
      tags:
        - Profile
      responses:
        '200':
          description: Permissions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                      example: users.create
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/me/roles:
    get:
      operationId: getMyRoles
      summary: Get current user roles
      description: Retrieve the roles of the currently authenticated user
      tags:
        - Profile
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/sessions/sign-up:
    post:
      operationId: signUp
      summary: User registration
      description: Creates a user, assigns the default role, optionally creates a personal workspace
        according to `REGISTRATION_WORKSPACE_MODE`, and returns tenant-scoped API tokens. Email
        delivery failure does not roll back the account.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
                - password_confirmation
              properties:
                full_name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                username:
                  type: string
                  example: johndoe
                  description: Optional username
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: password123
                password_confirmation:
                  type: string
                  format: password
                  example: password123
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/verify-email:
    get:
      operationId: verifyEmail
      summary: Verify user email
      description: Verify a user's email address using a token from the verification link.
      tags:
        - Authentication
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: The email verification token
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid or expired token
  /api/v1/resend-verification-email:
    post:
      operationId: resendVerificationEmail
      summary: Resend verification email
      description: Resends the email verification link to the authenticated user.
      tags:
        - Authentication
      responses:
        '200':
          description: Verification email sent successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          description: Verification email could not be delivered
  /api/v1/tenants:
    post:
      operationId: createTenant
      summary: Create a workspace
      description:
