    post:
      operationId: headlessPatientSession
      tags:
        - Headless
      summary: Exchange a patient link for a clinic-scoped session
      description: Requires the configured service user, active clinic membership and
        consultations.headless_patient in both token abilities and permissions.
        The clinic backend calls this API; patients do not need an account. All
        responses disable caching.
      security:
        - ServiceToken: []
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      responses:
        '200':
          description: Successful action; sensitive data must not be cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store, private
            Referrer-Policy:
              schema:
                type: string
                enum:
                  - no-referrer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HeadlessPatientState'
                  - type: object
                    required:
                      - session_secret
                    properties:
                      session_secret:
                        type: string
                        minLength: 32
                        maxLength: 128
                        description:
                          Opaque secret, valid no later than three hours or link expiry. A
                          new exchange replaces the previous session.
        '401':
          description: Missing/invalid service or patient credential,
            invalid/expired/replayed doctor assertion.
        '403':
          description: Missing membership/ability, inactive connection, mismatched service
            user or unauthorized clinician/action scope.
        '404':
          description: Consultation/link not found in this clinic.
        '409':
          description: Consultation state or consent does not permit this action.
        '422':
          description: Invalid request payload or query.
        '429':
          description: Rate limit exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - secret
              properties:
                secret:
                  type: string
                  minLength: 32
                  maxLength: 128
                  description: Secret fragment from the patient link; remove it from browser
                    history immediately.
